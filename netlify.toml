[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/hashback-stk"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/hashback-status"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/hashback-config"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/supabase-config"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/market-prices"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/payhero-stk"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/payhero-status"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/payhero-config"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/payhero-callback"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/payhero-callback-logs"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
